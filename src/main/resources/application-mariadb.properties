# Aktivieren mit SPRING_PROFILES_ACTIVE=mariadb (oder aws).
# Zugangsdaten stehen NICHT im Code: DB_URL, DB_USER, DB_PASSWORD kommen aus der Umgebung
# (Docker Compose: .env, AWS: ECS-Task-Definition bzw. Secrets Manager).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

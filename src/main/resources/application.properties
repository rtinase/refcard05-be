# --- Profile ---------------------------------------------------------------
# (kein Profil)  H2 im Speicher + lokaler Datei-Storage: Tests und schnelles Ausprobieren
# mariadb        MariaDB, Verbindung ueber DB_URL / DB_USER / DB_PASSWORD (Docker Compose, lokal)
# aws            wie mariadb, zusaetzlich Fotos in S3 (RDS-Endpoint und Bucket aus Umgebungsvariablen)
spring.profiles.group.aws=mariadb,s3

management.endpoint.health.show-details=always

# --- Foto-Storage ----------------------------------------------------------
# local = Dateisystem, s3 = Amazon S3 (Profil "s3" setzt app.storage.type=s3)
app.storage.type=${APP_STORAGE_TYPE:local}
app.storage.location=${APP_STORAGE_LOCATION:./uploads}
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:}
app.storage.s3.region=${APP_STORAGE_S3_REGION:us-east-1}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- CORS ------------------------------------------------------------------
# Kommagetrennte Liste; Standard sind die lokalen Dev-Server (siehe SpringWebConfig)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}
